    <g transform="rotate(24,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(48,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(72,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(96,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(120,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(144,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(168,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(192,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(216,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
    <g transform="rotate(240,660,95)"><polygon points="660,95 1600,-95 1600,95"/></g>
