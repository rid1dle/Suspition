<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1228"/>
      <stop offset="0.55" stop-color="#1d2748"/>
      <stop offset="1" stop-color="#3b4670"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9edf7" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e9edf7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#e9edf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc46b" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ffc46b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242e54"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
    <linearGradient id="mainHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19203c"/>
      <stop offset="1" stop-color="#101728"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0.75" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#4a5579"/>
      <stop offset="0.5" stop-color="#3a4568"/>
      <stop offset="1" stop-color="#232c49"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e9edf7">
    <circle cx="60" cy="50" r="1.5" opacity=".8"/>
    <circle cx="240" cy="38" r="1.2" opacity=".6"/>
    <circle cx="310" cy="96" r="1.6" opacity=".75"/>
    <circle cx="420" cy="42" r="1.1" opacity=".5"/>
    <circle cx="505" cy="80" r="1.5" opacity=".7"/>
    <circle cx="600" cy="36" r="1.2" opacity=".55"/>
    <circle cx="690" cy="88" r="1.6" opacity=".7"/>
    <circle cx="760" cy="44" r="1.1" opacity=".5"/>
    <circle cx="170" cy="132" r="1.2" opacity=".45"/>
    <circle cx="378" cy="140" r="1.1" opacity=".4"/>
    <circle cx="640" cy="130" r="1.2" opacity=".45"/>
    <circle cx="112" cy="190" r="1" opacity=".3"/>
  </g>

  <!-- moon -->
  <circle cx="152" cy="92" r="92" fill="url(#moonGlow)"/>
  <circle cx="152" cy="92" r="30" fill="#e9edf7"/>
  <circle cx="152" cy="92" r="30" fill="#cdd6e8" opacity=".35"/>

  <!-- far ridge -->
  <path d="M0,336 C100,308 190,312 300,282 C420,250 520,214 646,202 C722,195 772,202 800,208 L800,400 L0,400 Z" fill="url(#farHill)"/>

  <!-- main hill -->
  <path d="M0,400 L0,372 C110,360 196,344 300,312 C404,281 500,232 602,224 C690,217 758,232 800,244 L800,400 Z" fill="url(#mainHill)"/>

  <!-- lamp glow -->
  <ellipse cx="604" cy="206" rx="150" ry="86" fill="url(#lamp)"/>

  <!-- winding road -->
  <path d="M598,224 C566,228 528,240 476,256 C398,280 330,282 258,304 C186,326 168,352 196,400 L278,400 C250,356 262,338 318,322 C398,300 460,296 528,276 C572,263 596,248 612,230 Z" fill="url(#roadG)" opacity=".92"/>
  <path d="M598,224 C566,228 528,240 476,256 C398,280 330,282 258,304 C186,326 168,352 196,400" fill="none" stroke="#5b6party" stroke-width="0"/>

  <!-- tree -->
  <g fill="#0a0e1c">
    <rect x="700" y="182" width="7" height="46" rx="2"/>
    <path d="M703,112 C736,118 752,146 744,170 C738,190 718,198 703,196 C686,198 668,188 663,169 C656,145 672,117 703,112 Z"/>
    <path d="M703,150 L682,132 M703,166 L724,146" stroke="#0a0e1c" stroke-width="5"/>
  </g>

  <!-- house silhouette -->
  <g fill="#090d1a">
    <rect x="552" y="168" width="104" height="58"/>
    <path d="M540,170 L604,126 L668,170 Z"/>
    <rect x="636" y="134" width="13" height="26"/>
    <rect x="596" y="196" width="22" height="30" fill="#090d1a"/>
  </g>
  <!-- windows -->
  <g fill="#ffc46b">
    <rect x="564" y="182" width="18" height="18" rx="2"/>
    <rect x="626" y="182" width="18" height="18" rx="2"/>
    <rect x="598" y="146" width="12" height="12" rx="2" opacity=".85"/>
    <rect x="598" y="200" width="18" height="26" rx="2" opacity=".9"/>
  </g>
  <!-- window spill on ground -->
  <path d="M556,226 L536,250 L676,250 L652,226 Z" fill="#ffc46b" opacity=".1"/>

  <!-- foreground hill -->
  <path d="M0,400 L0,388 C90,378 150,392 228,400 Z" fill="#0a0e1c"/>
  <path d="M800,400 L800,372 C740,376 700,392 666,400 Z" fill="#0a0e1c"/>
</svg>