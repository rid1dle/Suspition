      <circle cx="400" cy="52" r="2" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="620" cy="140" r="2" stroke="#ff2fa0" stroke-width="2"/>
      <circle cx="740" cy="170" r="2" stroke="#00f0ff" stroke-width="2"/>
