  <rect width="800" height="400" fill="url(#sky)"/>
  <ellipse cx="445" cy="200" rx="150" ry="120" fill="url(#warm)" opacity=".45"/>
  <ellipse cx="690" cy="78" rx="90" ry="90" fill="url(#warm)" opacity=".35"/>
  <ellipse cx="366" cy="258" rx="55" ry="45" fill="url(#warm)" opacity=".35"/>

  <use href="#art" filter="url(#b2)" opacity=".75"/>
  <use href="#art" filter="url(#b1)" opacity=".85"/>
