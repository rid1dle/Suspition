<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detective: table</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap" id="app"><p class="muted">Connecting<span class="dots"></span></p></main>
  <aside class="music" id="music">
    <button id="music-toggle" class="chip" aria-pressed="false"><span id="music-meter" class="meter-dot"></span><span id="music-label">Music off</span></button>
    <input type="range" id="music-volume" min="0" max="1" step="0.05" aria-label="Music volume">
    <div class="small muted" id="music-desc"></div>
  </aside>
  <script type="module" src="/table.js"></script>
</body>
</html>
